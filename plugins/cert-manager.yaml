# Manage cert-manager Certificate resources via cmctl.
# See: https://github.com/cert-manager/cmctl
# Every command uses the context and kubeconfig selected by K9s.
plugins:
  cert-status:
    shortCut: Shift-S
    # Explicitly replace SortStatus in the Certificate view.
    override: true
    confirm: false
    description: Certificate status
    scopes:
      - certificates
    command: bash
    background: false
    args:
      - -c
      - 'set -euo pipefail; values=("$@"); KUBECONFIG="${values[1]}" cmctl status certificate --context "${values[0]}" -n "${values[2]}" "${values[3]}" |& less -K'
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME
  cert-renew:
    shortCut: Shift-R
    confirm: true
    dangerous: true
    description: Certificate renew
    scopes:
      - certificates
    command: bash
    background: false
    args:
      - -c
      - 'set -euo pipefail; values=("$@"); KUBECONFIG="${values[1]}" cmctl renew --context "${values[0]}" -n "${values[2]}" "${values[3]}" |& less -K'
      # Bash's command label is shown in K9s' confirmation, never executed.
      - 'Renew certificate $NAMESPACE/$NAME in context $CONTEXT?'
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME
  secret-inspect:
    shortCut: Shift-I
    confirm: false
    description: Inspect secret
    scopes:
      - secrets
    command: bash
    background: false
    args:
      - -c
      - 'set -euo pipefail; values=("$@"); KUBECONFIG="${values[1]}" cmctl inspect secret --context "${values[0]}" -n "${values[2]}" "${values[3]}" |& less -K'
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME
