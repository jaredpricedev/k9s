# Copy this file to $XDG_CONFIG_HOME/k9s/plugins/flux.yaml.
# Requires the Flux CLI. Flux Operator actions also require the flux-operator CLI.
# Every command uses the context and kubeconfig selected by K9s.
plugins:
  toggle-helmrelease:
    shortCut: Shift-T
    override: true
    confirm: true
    dangerous: true
    scopes: [helmreleases]
    description: Toggle HelmRelease suspend/resume
    command: bash
    background: false
    args:
      - -c
      - >-
        set -euo pipefail; values=("$@");
        state=("$(KUBECONFIG="${values[1]}" kubectl --context "${values[0]}" get helmrelease -n "${values[2]}" "${values[3]}" -o jsonpath='{.spec.suspend}')");
        verb=(suspend); [[ "${state[0]}" == true ]] && verb=(resume);
        KUBECONFIG="${values[1]}" flux "${verb[0]}" helmrelease --context "${values[0]}" -n "${values[2]}" "${values[3]}" | less -K
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME

  toggle-kustomization:
    shortCut: Shift-T
    override: true
    confirm: true
    dangerous: true
    scopes: [kustomizations]
    description: Toggle Kustomization suspend/resume
    command: bash
    background: false
    args:
      - -c
      - >-
        set -euo pipefail; values=("$@");
        state=("$(KUBECONFIG="${values[1]}" kubectl --context "${values[0]}" get kustomization -n "${values[2]}" "${values[3]}" -o jsonpath='{.spec.suspend}')");
        verb=(suspend); [[ "${state[0]}" == true ]] && verb=(resume);
        KUBECONFIG="${values[1]}" flux "${verb[0]}" kustomization --context "${values[0]}" -n "${values[2]}" "${values[3]}" | less -K
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME

  reconcile-git:
    shortCut: Shift-R
    override: true
    confirm: false
    dangerous: true
    description: Reconcile GitRepository
    scopes: [gitrepositories]
    command: bash
    background: false
    args:
      - -c
      - 'set -euo pipefail; values=("$@"); KUBECONFIG="${values[1]}" flux reconcile source git --context "${values[0]}" -n "${values[2]}" "${values[3]}" | less -K'
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME

  reconcile-hr:
    shortCut: Shift-R
    override: true
    confirm: false
    dangerous: true
    description: Reconcile HelmRelease
    scopes: [helmreleases]
    command: bash
    background: false
    inputs:
      - {name: force, label: Force install/upgrade, type: bool, default: false}
      - {name: reset, label: Reset failure count, type: bool, default: false}
      - {name: source, label: Reconcile source as well, type: bool, default: false}
    args:
      - -c
      - >-
        set -euo pipefail; values=("$@"); flags=();
        [[ "${values[4]}" == true ]] && flags+=(--force);
        [[ "${values[5]}" == true ]] && flags+=(--reset);
        [[ "${values[6]}" == true ]] && flags+=(--with-source);
        KUBECONFIG="${values[1]}" flux reconcile helmrelease --context "${values[0]}" -n "${values[2]}" "${values[3]}" "${flags[@]}" | less -K
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME
      - $INPUT_FORCE
      - $INPUT_RESET
      - $INPUT_SOURCE

  reconcile-helm-repo:
    shortCut: Shift-Z
    confirm: false
    dangerous: true
    description: Reconcile HelmRepository
    scopes: [helmrepositories]
    command: bash
    background: false
    args:
      - -c
      - 'set -euo pipefail; values=("$@"); KUBECONFIG="${values[1]}" flux reconcile source helm --context "${values[0]}" -n "${values[2]}" "${values[3]}" | less -K'
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME

  reconcile-oci-repo:
    shortCut: Shift-Z
    confirm: false
    dangerous: true
    description: Reconcile OCIRepository
    scopes: [ocirepositories]
    command: bash
    background: false
    args:
      - -c
      - 'set -euo pipefail; values=("$@"); KUBECONFIG="${values[1]}" flux reconcile source oci --context "${values[0]}" -n "${values[2]}" "${values[3]}" | less -K'
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME

  reconcile-ks:
    shortCut: Shift-R
    override: true
    confirm: false
    dangerous: true
    description: Reconcile Kustomization
    scopes: [kustomizations]
    command: bash
    background: false
    inputs:
      - {name: source, label: Reconcile source as well, type: bool, default: false}
    args:
      - -c
      - >-
        set -euo pipefail; values=("$@"); flags=();
        [[ "${values[4]}" == true ]] && flags+=(--with-source);
        KUBECONFIG="${values[1]}" flux reconcile kustomization --context "${values[0]}" -n "${values[2]}" "${values[3]}" "${flags[@]}" | less -K
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME
      - $INPUT_SOURCE

  reconcile-ir:
    shortCut: Shift-R
    override: true
    confirm: false
    dangerous: true
    description: Reconcile ImageRepository
    scopes: [imagerepositories]
    command: bash
    background: false
    args:
      - -c
      - 'set -euo pipefail; values=("$@"); KUBECONFIG="${values[1]}" flux reconcile image repository --context "${values[0]}" -n "${values[2]}" "${values[3]}" | less -K'
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME

  reconcile-iua:
    shortCut: Shift-R
    override: true
    confirm: false
    dangerous: true
    description: Reconcile ImageUpdateAutomation
    scopes: [imageupdateautomations]
    command: bash
    background: false
    args:
      - -c
      - 'set -euo pipefail; values=("$@"); KUBECONFIG="${values[1]}" flux reconcile image update --context "${values[0]}" -n "${values[2]}" "${values[3]}" | less -K'
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME

  toggle-rset:
    shortCut: Shift-T
    override: true
    confirm: true
    dangerous: true
    scopes: [resourcesets]
    description: Toggle ResourceSet suspend/resume
    command: bash
    background: false
    args:
      - -c
      - >-
        set -euo pipefail; values=("$@");
        state=("$(KUBECONFIG="${values[1]}" kubectl --context "${values[0]}" get resourceset -n "${values[2]}" "${values[3]}" -o jsonpath='{.metadata.annotations.fluxcd\.controlplane\.io/reconcile}')");
        verb=(suspend); [[ "${state[0]}" == disabled ]] && verb=(resume);
        KUBECONFIG="${values[1]}" flux-operator "${verb[0]}" rset --kube-context "${values[0]}" -n "${values[2]}" "${values[3]}" | less -K
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME

  toggle-inputprovider:
    shortCut: Shift-T
    override: true
    confirm: true
    dangerous: true
    scopes: [resourcesetinputproviders]
    description: Toggle ResourceSetInputProvider suspend/resume
    command: bash
    background: false
    args:
      - -c
      - >-
        set -euo pipefail; values=("$@");
        state=("$(KUBECONFIG="${values[1]}" kubectl --context "${values[0]}" get resourcesetinputprovider -n "${values[2]}" "${values[3]}" -o jsonpath='{.metadata.annotations.fluxcd\.controlplane\.io/reconcile}')");
        verb=(suspend); [[ "${state[0]}" == disabled ]] && verb=(resume);
        KUBECONFIG="${values[1]}" flux-operator "${verb[0]}" inputprovider --kube-context "${values[0]}" -n "${values[2]}" "${values[3]}" | less -K
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME

  reconcile-rset:
    shortCut: Shift-R
    override: true
    confirm: false
    dangerous: true
    description: Reconcile ResourceSet
    scopes: [resourcesets]
    command: bash
    background: false
    args:
      - -c
      - 'set -euo pipefail; values=("$@"); KUBECONFIG="${values[1]}" flux-operator reconcile rset --kube-context "${values[0]}" -n "${values[2]}" "${values[3]}" | less -K'
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME

  reconcile-inputprovider:
    shortCut: Shift-R
    override: true
    confirm: false
    dangerous: true
    description: Reconcile ResourceSetInputProvider
    scopes: [resourcesetinputproviders]
    command: bash
    background: false
    args:
      - -c
      - 'set -euo pipefail; values=("$@"); KUBECONFIG="${values[1]}" flux-operator reconcile inputprovider --kube-context "${values[0]}" -n "${values[2]}" "${values[3]}" | less -K'
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME

  reconcile-fluxinstance:
    shortCut: Shift-R
    override: true
    confirm: false
    dangerous: true
    description: Reconcile FluxInstance
    scopes: [fluxinstances]
    command: bash
    background: false
    args:
      - -c
      - 'set -euo pipefail; values=("$@"); KUBECONFIG="${values[1]}" flux-operator reconcile instance --kube-context "${values[0]}" -n "${values[2]}" "${values[3]}" | less -K'
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME

  toggle-fluxinstance:
    shortCut: Shift-T
    override: true
    confirm: true
    dangerous: true
    scopes: [fluxinstances]
    description: Toggle FluxInstance suspend/resume
    command: bash
    background: false
    args:
      - -c
      - >-
        set -euo pipefail; values=("$@");
        state=("$(KUBECONFIG="${values[1]}" kubectl --context "${values[0]}" get fluxinstance -n "${values[2]}" "${values[3]}" -o jsonpath='{.metadata.annotations.fluxcd\.controlplane\.io/reconcile}')");
        verb=(suspend); [[ "${state[0]}" == disabled ]] && verb=(resume);
        KUBECONFIG="${values[1]}" flux-operator "${verb[0]}" instance --kube-context "${values[0]}" -n "${values[2]}" "${values[3]}" | less -K
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME

  trace:
    shortCut: Shift-Q
    confirm: false
    description: Trace Flux ownership
    scopes: [all]
    command: bash
    background: false
    args:
      - -c
      - >-
        set -euo pipefail; values=("$@");
        endpoint=("/api/${values[5]}"); api_version=("${values[5]}");
        if [[ -n "${values[4]}" ]]; then endpoint=("/apis/${values[4]}/${values[5]}"); api_version=("${values[4]}/${values[5]}"); fi;
        resource=("$(KUBECONFIG="${values[1]}" kubectl --context "${values[0]}" get --raw "${endpoint[0]}" | TARGET_RESOURCE="${values[6]}" jq -er '.resources[] | select(.name == env.TARGET_RESOURCE)')");
        kind=("$(jq -er '.kind' <<<"${resource[0]}")"); namespaced=("$(jq -r '.namespaced' <<<"${resource[0]}")");
        flags=(--kind "${kind[0]}" --api-version "${api_version[0]}");
        case "${namespaced[0]}" in true) flags+=(--namespace "${values[2]}");; false) :;; *) echo 'Flux trace discovery returned an invalid namespaced field' >&2; exit 1;; esac;
        KUBECONFIG="${values[1]}" flux trace --context "${values[0]}" "${flags[@]}" "${values[3]}" 2>&1 | less -K
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME
      - $RESOURCE_GROUP
      - $RESOURCE_VERSION
      - $RESOURCE_NAME

  tree-kustomization:
    shortCut: Shift-Y
    confirm: false
    description: Flux resource tree
    scopes: [kustomizations]
    command: bash
    background: false
    args:
      - -c
      - 'set -euo pipefail; values=("$@"); KUBECONFIG="${values[1]}" flux tree kustomization --context "${values[0]}" -n "${values[2]}" "${values[3]}" | less -K'
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME

  controller-logs:
    shortCut: Shift-L
    confirm: false
    description: Flux reconciliation logs
    scopes:
      - gitrepositories
      - ocirepositories
      - buckets
      - helmrepositories
      - helmcharts
      - kustomizations
      - helmreleases
      - imagerepositories
      - imagepolicies
      - imageupdateautomations
      - alerts
      - providers
      - receivers
    command: bash
    background: false
    args:
      - -c
      - >-
        set -euo pipefail; values=("$@"); endpoint=("/api/${values[5]}");
        if [[ -n "${values[4]}" ]]; then endpoint=("/apis/${values[4]}/${values[5]}"); fi;
        resource=("$(KUBECONFIG="${values[1]}" kubectl --context "${values[0]}" get --raw "${endpoint[0]}" | TARGET_RESOURCE="${values[6]}" jq -er '.resources[] | select(.name == env.TARGET_RESOURCE)')");
        kind=("$(jq -er '.kind' <<<"${resource[0]}")");
        KUBECONFIG="${values[1]}" flux logs --context "${values[0]}" --kind "${kind[0]}" --name "${values[3]}" --namespace "${values[2]}" | less -K
      - _
      - $CONTEXT
      - $KUBECONFIG
      - $NAMESPACE
      - $NAME
      - $RESOURCE_GROUP
      - $RESOURCE_VERSION
      - $RESOURCE_NAME

  # Credits: https://github.com/fluxcd/flux2/discussions/2494
  get-suspended-helmreleases:
    shortCut: Shift-S
    override: true
    confirm: false
    description: Suspended HelmReleases
    scopes: [helmreleases]
    command: bash
    background: false
    args:
      - -c
      - >-
        set -euo pipefail; values=("$@");
        KUBECONFIG="${values[1]}" kubectl --context "${values[0]}" --all-namespaces get helmreleases.helm.toolkit.fluxcd.io -o json | jq -r '.items[] | select(.spec.suspend == true) | [.metadata.namespace, .metadata.name, .spec.suspend] | @tsv' | less -K
      - _
      - $CONTEXT
      - $KUBECONFIG

  get-suspended-kustomizations:
    shortCut: Shift-S
    override: true
    confirm: false
    description: Suspended Kustomizations
    scopes: [kustomizations]
    command: bash
    background: false
    args:
      - -c
      - >-
        set -euo pipefail; values=("$@");
        KUBECONFIG="${values[1]}" kubectl --context "${values[0]}" --all-namespaces get kustomizations.kustomize.toolkit.fluxcd.io -o json | jq -r '.items[] | select(.spec.suspend == true) | [.metadata.namespace, .metadata.name, .spec.suspend] | @tsv' | less -K
      - _
      - $CONTEXT
      - $KUBECONFIG
