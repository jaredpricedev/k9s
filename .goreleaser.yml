# Modified for k9+ by the k9+ contributors; see MODIFICATIONS.md.
version: 2

project_name: k9plus

before:
  hooks:
    - go mod download
    - go generate ./...
    - make licenses

release:
  github:
    owner: jaredpricedev
    name: k9s
  prerelease: auto

env:
  - CGO_ENABLED=0

builds:
  - id: linux
    binary: k9plus
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
      - ppc64le
      - s390x
    goarm:
      - 7
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/derailed/k9s/cmd.version=v{{.Version}}
      - -s -w -X github.com/derailed/k9s/cmd.commit={{.Commit}}
      - -s -w -X github.com/derailed/k9s/cmd.date={{.Date}}

  - id: freebsd
    binary: k9plus
    goos:
      - freebsd
    goarch:
      - amd64
      - arm64
    goarm:
      - 7
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/derailed/k9s/cmd.version=v{{.Version}}
      - -s -w -X github.com/derailed/k9s/cmd.commit={{.Commit}}
      - -s -w -X github.com/derailed/k9s/cmd.date={{.Date}}

  - id: osx
    binary: k9plus
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/derailed/k9s/cmd.version=v{{.Version}}
      - -s -w -X github.com/derailed/k9s/cmd.commit={{.Commit}}
      - -s -w -X github.com/derailed/k9s/cmd.date={{.Date}}

  - id: windows
    binary: k9plus
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/derailed/k9s/cmd.version=v{{.Version}}
      - -s -w -X github.com/derailed/k9s/cmd.commit={{.Commit}}
      - -s -w -X github.com/derailed/k9s/cmd.date={{.Date}}

archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}amd64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - COPYING
      - NOTICE
      - MODIFICATIONS.md
      - README.md
      - docs/licensing.md
      # The recursive glob covers descendants; name the bundle root files too.
      - THIRD_PARTY_LICENSES/README.txt
      - THIRD_PARTY_LICENSES/manifest.json
      - THIRD_PARTY_LICENSES/go.mod
      - THIRD_PARTY_LICENSES/**/*
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.sha256"

snapshot:
  version_template: "0.1.0-dev-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

nfpms:
  - package_name: k9plus
    file_name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    maintainer: k9+ contributors
    homepage: https://github.com/jaredpricedev/k9s
    description: k9+ is an independent Kubernetes terminal UI fork of K9s.
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: utils
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/k9plus/LICENSE
        file_info:
          mode: 0644
      - src: ./COPYING
        dst: /usr/share/doc/k9plus/COPYING
        file_info:
          mode: 0644
      - src: ./NOTICE
        dst: /usr/share/doc/k9plus/NOTICE
        file_info:
          mode: 0644
      - src: ./MODIFICATIONS.md
        dst: /usr/share/doc/k9plus/MODIFICATIONS.md
        file_info:
          mode: 0644
      - src: ./docs/licensing.md
        dst: /usr/share/doc/k9plus/docs/licensing.md
        file_info:
          mode: 0644
      - src: ./THIRD_PARTY_LICENSES/
        dst: /usr/share/doc/k9plus/THIRD_PARTY_LICENSES/
        type: tree

sboms:
  - artifacts: archive
