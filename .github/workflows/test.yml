# Modified for k9+ by the k9+ contributors; see MODIFICATIONS.md.
name: k9+ Test

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - rc*
      - v*
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup GO env
        run: go env -w CGO_ENABLED=0

      - name: Run Tests
        run: make test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test license collector
        run: python3 -m unittest discover -s scripts -p test_collect_licenses.py

      - name: Check distribution license bundle
        run: make licenses
