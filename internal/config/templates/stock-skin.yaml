# Stock semantic presentation. Existing skin fields remain supported.
k9s:
  body:
    fgColor: '#e1e7e3'
    bgColor: '#0b0e11'
    logoColor: '#79c7d4'
    logoColorMsg: '#e1e7e3'
    logoColorInfo: '#91b8ec'
    logoColorWarn: '#e7bd73'
    logoColorError: '#ef8278'
  prompt:
    fgColor: '#e1e7e3'
    bgColor: '#0b0e11'
    suggestColor: '#a5b0aa'
    border:
      command: '#79c7d4'
      default: '#79c7d4'
  help:
    fgColor: '#e1e7e3'
    bgColor: '#0b0e11'
    sectionColor: '#79c7d4'
    keyColor: '#79c7d4'
    numKeyColor: '#b6a3df'
  frame:
    title:
      fgColor: '#e1e7e3'
      bgColor: '#0b0e11'
      highlightColor: '#79c7d4'
      counterColor: '#a5b0aa'
      filterColor: '#79c7d4'
    border:
      fgColor: '#a5b0aa'
      focusColor: '#79c7d4'
    menu:
      fgStyle: normal
      fgColor: '#e1e7e3'
      keyColor: '#79c7d4'
      numKeyColor: '#b6a3df'
    crumbs:
      fgColor: '#e1e7e3'
      bgColor: '#131a1e'
      activeColor: '#79c7d4'
    status:
      newColor: '#e1e7e3'
      modifyColor: '#8fce88'
      addColor: '#91b8ec'
      pendingColor: '#e7bd73'
      errorColor: '#ef8278'
      highlightColor: '#79c7d4'
      killColor: '#a5b0aa'
      completedColor: '#a5b0aa'
  info:
    sectionColor: '#a5b0aa'
    fgColor: '#e1e7e3'
    cpuColor: '#91b8ec'
    memColor: '#b6a3df'
    k9sRevColor: '#79c7d4'
  views:
    table:
      fgColor: '#e1e7e3'
      bgColor: '#0b0e11'
      cursorFgColor: '#e1e7e3'
      cursorBgColor: '#1c292f'
      markColor: '#b6a3df'
      header:
        fgColor: '#a5b0aa'
        bgColor: '#0b0e11'
        sorterColor: '#79c7d4'
        selectedSortColumnColor: '#79c7d4'
    xray:
      fgColor: '#e1e7e3'
      bgColor: '#0b0e11'
      cursorColor: '#1c292f'
      cursorTextColor: '#e1e7e3'
      graphicColor: '#a5b0aa'
    charts:
      bgColor: '#0b0e11'
      dialBgColor: '#0b0e11'
      chartBgColor: '#0b0e11'
      focusFgColor: '#0b0e11'
      focusBgColor: '#79c7d4'
      defaultDialColors:
      - '#8fce88'
      - '#ef8278'
      defaultChartColors:
      - '#8fce88'
      - '#ef8278'
      resourceColors:
        cpu:
        - '#91b8ec'
        - '#1c292f'
        mem:
        - '#b6a3df'
        - '#1c292f'
    yaml:
      keyColor: '#b6a3df'
      valueColor: '#e1e7e3'
      colonColor: '#e1e7e3'
    picker:
      mainColor: '#e1e7e3'
      focusColor: '#79c7d4'
      shortcutColor: '#79c7d4'
    logs:
      fgColor: '#e1e7e3'
      bgColor: '#0b0e11'
      indicator:
        fgColor: '#a5b0aa'
        bgColor: '#0b0e11'
        toggleOnColor: '#79c7d4'
        toggleOffColor: '#a5b0aa'
  dialog:
    fgColor: '#e1e7e3'
    bgColor: '#131a1e'
    buttonFgColor: '#e1e7e3'
    buttonBgColor: '#1c292f'
    buttonFocusFgColor: '#0b0e11'
    buttonFocusBgColor: '#79c7d4'
    labelFgColor: '#e1e7e3'
    fieldFgColor: '#e1e7e3'
